version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: money-banking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: money-banking-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: money-banking-tests
    depends_on:
      app-backend:
        condition: service_started

volumes:
  postgres_data: