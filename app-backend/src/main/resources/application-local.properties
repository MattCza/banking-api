# PostgreSQL Database Connection Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_db}
spring.datasource.username=${DB_USERNAME:postgres_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-local-dev-only-jwt-secret-2026}
jwt.expiration=${JWT_EXPIRATION:5000}
