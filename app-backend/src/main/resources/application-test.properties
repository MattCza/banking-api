# H2 In-Memory Database Connection Settings
spring.datasource.url=jdbc:h2:mem:banking_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Force Hibernate to use H2 behavior
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console Access if - true - view the H2 database via browser: http://localhost:8080/h2-console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Optional: Cleans the schema if it detects structural mismatches during rapid testing
spring.flyway.clean-disabled=true

# Tell Flyway to baseline an existing database schema automatically
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}